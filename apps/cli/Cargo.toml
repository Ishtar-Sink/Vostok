[package]
name = "vostok"
version = "0.2.1"
edition = "2021"
description = "CLI do Vostok: instala o harness nos projetos e executa os comandos dele."
license = "MIT"
publish = false

[lib]
name = "vostok"
path = "src/lib.rs"

[[bin]]
name = "vostok"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
include_dir = "0.7"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.20"
