<figure class="piece">
  <div class="piece-top"><span class="piece-id">#{TASK_ID}</span> — #{TASK_TITLE}</div>
  <div class="piece-meta"><b class="piece-title">#{TITLE}</b><small class="piece-file">#{FILE}</small><span class="tag #{KIND_CLASS}">#{KIND}</span></div>
  <div class="piece-media">
#{BEFORE}
#{MEDIA}
  </div>
  <figcaption class="piece-foot">
#{SHOWS}
#{WHERE}
#{FAILURE}
    <p><b>Como chegar</b>#{REACH}</p>
    <p><b>Como ler</b>#{READ}</p>
  </figcaption>
</figure>
