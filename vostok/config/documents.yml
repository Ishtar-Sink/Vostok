# Fontes do sistema, sem requisições externas. Valem nos dois temas e viram `--font-<chave>`.
font:
  body: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  mono: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
  text: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  display: '"Outfit", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif'
