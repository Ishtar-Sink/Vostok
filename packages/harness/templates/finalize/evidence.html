<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>#{DOC_TITLE}</title>
<style>
#{TOKENS}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.6 var(--font-text); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0 0 12px; }
p:last-child { margin-bottom: 0; }
strong { font-weight: 650; }
a { color: var(--primary); }
code { font: .86em var(--font-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 6px; overflow-wrap: anywhere; }
pre { margin: 0 0 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
pre code { background: none; padding: 0; font-size: 12.5px; overflow-wrap: normal; white-space: pre; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; }
.eyebrow { font: 600 12px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: .12em; color: var(--primary); }
.na { color: var(--text-muted); font-style: italic; }

/* Cabeçalho e faixa do resumo */
header.head { padding-block: 28px 0; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
.brand { font: 700 14px/1 var(--font-display); display: flex; align-items: center; gap: 10px; }
.brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--brand); display: inline-block; }
.tbtn { font: 500 13px/1 var(--font-text); color: var(--text-muted); background: var(--surface); border: 1px solid var(--border);
        border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tbtn:hover { border-color: var(--border-strong); color: var(--text); }
.tbtn:focus-visible, .toc a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1 { font-size: clamp(30px, 4.6vw, 44px); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; margin: 10px 0 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--text-muted); }
.summary { margin-top: 28px; background: var(--calm); border: 1px solid var(--border); border-radius: 26px; padding: clamp(20px, 3.5vw, 32px);
           display: grid; gap: 28px; align-items: center; }
.summary:has(.facts) { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
.summary .label { display: block; margin-bottom: 10px; }
.summary .lead { font-size: 17px; line-height: 1.6; max-width: 80ch; }
.facts { display: grid; gap: 10px; }
.fact { background: var(--surface); border-radius: 12px; padding: 12px 16px; display: flex; align-items: baseline; gap: 14px; box-shadow: var(--shadow-sm); }
.fact b { font: 800 28px/1 var(--font-display); color: var(--primary); letter-spacing: -.02em; min-width: 2.6ch; font-variant-numeric: tabular-nums; }
.fact span { font-size: 14px; color: var(--text-muted); line-height: 1.4; }

/* Índice e cartões */
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; padding-block: 32px 64px; }
.toc { position: sticky; top: 24px; align-self: start; font-size: 14px; }
.toc p { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); margin-bottom: 12px; }
.toc ol { list-style: none; padding: 0; margin: 0; border-left: 1px solid var(--border); }
.toc li { margin: 0; }
.toc a { display: flex; gap: 10px; padding: 6px 0 6px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--text-muted); text-decoration: none; }
.toc a span { font-variant-numeric: tabular-nums; color: var(--text-faint); }
.toc a:hover { color: var(--text); }
.toc a.on { color: var(--primary); border-left-color: var(--primary); font-weight: 550; }
.blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; min-width: 0; }
.blk { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-sm);
       padding: clamp(20px, 3.5vw, 32px); scroll-margin-top: 24px; min-width: 0; }
.blk.half { grid-column: auto; }
.blk > .label { display: block; margin-bottom: 6px; color: var(--text-muted); }
.blk > h2 { font-size: 22px; font-weight: 750; letter-spacing: -.015em; margin-bottom: 14px; }
.blk > .sub { color: var(--text-muted); font-size: 14px; margin: -8px 0 16px; }
.blk h3 { font-size: 17px; font-weight: 700; margin: 22px 0 8px; }
.blk h4, .blk h5, .blk h6 { font-size: 15px; font-weight: 700; margin: 16px 0 6px; }
.md { max-width: 72ch; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 4px 0; }
li::marker { color: var(--primary); }

/* Tabelas */
.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); margin: 0 0 14px; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th { text-align: left; font: 600 12px/1.4 var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted);
     padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-muted); white-space: nowrap; }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.strong { font-weight: 600; }

/* Índice e seções por tarefa, no HTML do finalize.rs: links soltos e .panel com .sec-h, numerados por contador */
.toc .links { border-left: 1px solid var(--border); counter-reset: task; }
.toc .links a::before { counter-increment: task; content: counter(task, decimal-leading-zero); color: var(--text-faint); font-variant-numeric: tabular-nums; }
.blocks { counter-reset: panel; }
.panel { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-sm);
         padding: clamp(20px, 3.5vw, 32px); scroll-margin-top: 24px; min-width: 0; }
.panel::before { counter-increment: panel; content: counter(panel, decimal-leading-zero); display: block; margin-bottom: 6px;
                 font: 600 12px/1.2 var(--font-display); letter-spacing: .12em; color: var(--text-muted); }
.panel .sec-h h2 { font-size: 22px; font-weight: 750; letter-spacing: -.015em; margin-bottom: 14px; }
/* Peças de evidência */
.piece { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.piece-top { padding: 12px 16px 0; font-size: 12px; color: var(--text-muted); }
.piece-id { font: 700 11.5px var(--font-mono); color: var(--primary); }
.piece-meta { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; padding: 4px 16px 10px; }
.piece-meta b { font-size: 14px; overflow-wrap: anywhere; }
.piece-media { padding: 0 16px; }
.piece-label { margin: 12px 0 6px; font-size: 12px; font-weight: 700; color: var(--text-muted); }
.piece-media img, .piece-media video { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
.piece-media pre { margin: 0; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
                   overflow: auto; max-height: 520px; font: 12px/1.5 var(--font-mono); white-space: pre; }
.piece-media pre code { background: none; padding: 0; border-radius: 0; font: inherit; }
.piece-media .asset { margin: 0; padding: 12px 14px; background: var(--surface-muted); border-radius: 8px; font-size: 13px; }
.piece-media .asset small { display: block; color: var(--text-muted); margin-top: 2px; }
.piece-foot { margin: 12px 0 0; padding: 12px 16px 14px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; }
.piece-foot p { margin: 0 0 8px; }
.piece-foot p:last-child { margin-bottom: 0; }
.piece-foot b { display: block; text-transform: uppercase; font-size: 10.5px; letter-spacing: .08em; color: var(--text); opacity: .7; margin-bottom: 1px; }
.piece.none { padding: 12px 16px 14px; }
.piece.none p { margin: 6px 0 0; color: var(--text-muted); font-size: 13px; }

/* Etiquetas e notas */
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px; border-radius: 999px;
       white-space: nowrap; background: var(--surface-muted); color: var(--text-muted); }
.chip { display: inline-block; font: 700 11.5px var(--font-mono); color: var(--primary); background: var(--primary-soft);
        padding: 1px 7px; border-radius: 999px; margin: 0 4px 3px 0; white-space: nowrap; }
.tag.criar { background: var(--success-soft); color: var(--success); }
.tag.alterar { background: var(--primary-soft); color: var(--primary); }
.tag.auto { background: var(--success-soft); color: var(--success); }
.tag.manual { background: var(--warning-soft); color: var(--warning); }
td.path { font: 12.5px var(--font-mono); overflow-wrap: anywhere; }
td.mono { font: 12.5px var(--font-mono); white-space: nowrap; }
.md { font-size: 14px; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
.md li { margin: 4px 0; }
.md li::marker { color: var(--primary); }
.note { background: var(--primary-soft); border-radius: 9px; padding: 15px 18px; font-size: 13.5px; margin: 20px 0 0; }
.note > b:first-child { display: block; text-transform: uppercase; font-size: 10.5px; letter-spacing: .08em; margin-bottom: 4px; color: var(--primary); }
.note p:last-child, .note ul:last-child, .note ol:last-child { margin-bottom: 0; }
.note ul, .note ol { margin: 0 0 10px; padding-left: 20px; }
.note.warn { background: var(--warning-soft); }
.note.warn > b:first-child { color: var(--warning); }

footer { padding-block: 0 40px; color: var(--text-muted); font-size: 13px; }

@media (max-width: 860px) {
  .summary:has(.facts) { grid-template-columns: 1fr; }
  .layout { grid-template-columns: 1fr; gap: 16px; padding-top: 20px; }
  .toc { position: static; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .toc ol { columns: 2; column-gap: 16px; border: 0; }
  .toc a { padding-left: 0; border: 0; }
  .blocks { grid-template-columns: 1fr; }
  .blk.half { grid-column: 1 / -1; }
}
@page { margin: 14mm 0; }
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tbtn, .toc { display: none; }
  .layout { grid-template-columns: 1fr; }
  .blk { break-inside: avoid-page; box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="head"><div class="wrap">
  <div class="top"><span class="brand"><i></i>Vostok</span><button type="button" class="tbtn" id="theme-toggle" aria-pressed="false">Tema escuro</button></div>
  <span class="eyebrow">Evidências · #{SPEC_ID}</span>
  <h1>#{SPEC_TITLE}</h1>
  <div class="meta"><span>#{SPEC_ID}</span><span>Aprovada em #{APPROVED}</span><span>Concluída em #{FINISHED}</span></div>
  <div class="summary"><div><span class="eyebrow label">Em resumo</span><div class="lead">
#{SUMMARY}
  </div></div></div>
</div></header>

<div class="wrap layout">
  <nav class="toc" aria-label="Índice"><p>Tarefas</p><div class="links">
#{NAV}
  </div></nav>
  <main class="blocks">
#{ITEMS}
  </main>
</div>

<footer><div class="wrap">Vostok · evidências de #{SPEC_ID}, uma peça por evidência, com como chegar e como ler.</div></footer>
<script>
(function () {
  // Tema: a escolha fica só no navegador de quem lê; sem escolha, vale a preferência do sistema.
  var root = document.documentElement, key = "vostok-doc-theme";
  try { var saved = localStorage.getItem(key); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  var button = document.getElementById("theme-toggle");
  function current() {
    return root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function label() {
    var dark = current() === "dark";
    button.textContent = dark ? "Tema claro" : "Tema escuro";
    button.setAttribute("aria-pressed", dark ? "true" : "false");
  }
  button.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(key, next); } catch (e) {}
    label();
  });
  label();

  // Índice: marca a seção em leitura. Seções sem conteúdo saem do índice.
  var links = Array.prototype.slice.call(document.querySelectorAll(".toc a")).filter(function (a) {
    if (document.getElementById(a.getAttribute("href").slice(1))) return true;
    var item = a.parentNode.tagName === "LI" ? a.parentNode : a;
    item.parentNode.removeChild(item);
    return false;
  });
  if (!("IntersectionObserver" in window)) return;
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + entry.target.id); });
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  Array.prototype.forEach.call(document.querySelectorAll(".blk[id], .panel[id]"), function (el) { observer.observe(el); });
})();
</script>
</body>
</html>
