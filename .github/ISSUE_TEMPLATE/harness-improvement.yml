name: Melhoria do harness
description: Sugere a melhoria de algo que o próprio harness Vostok já faz (CLI vostok, skills, regras, templates e configuração distribuídos).
title: "[harness-improvement] "
body:
  - type: markdown
    attributes:
      value: |
        Use este modelo só para melhorias do próprio harness Vostok: a CLI `vostok`, as skills padrão, as regras do agente, os templates e a configuração distribuídos. Sugestões para o código, as regras ou as skills customizadas do seu projeto não entram aqui.

        A issue é pública: não cole dados privados. Troque caminhos, nomes, trechos de código e saídas do seu projeto por exemplos neutros e mascare segredos com `***`. No projeto, a skill `suggest-harness-improvement` monta esta sugestão por você.
  - type: textarea
    id: version
    attributes:
      label: Versão
      description: Saída de `vostok --version` e o sistema operacional (`uname -sr`).
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Situação atual
      description: O comando, a skill ou o arquivo envolvido e como funciona hoje.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Melhoria proposta
      description: O que mudar e como deveria passar a funcionar.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Benefício
      description: Quem ganha com a melhoria e o que melhora.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver e por que ficaram de fora, ou "Nenhuma".
    validations:
      required: true
